services:
  client:
    build:
      context: .
      target: development
    container_name: 'cliente_otb'
    restart: unless-stopped
    ports:
      - '5174:5173'
    volumes:
      - .:/app
      - node_modules_otb_frontend:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
volumes:
  node_modules_otb_frontend:
